<body>
<div class="page" style="background: #221E18; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;">

  <nav id="site-nav" class="site-nav">
    <a href="index.html" class="brand">
      <img src="../assets/logo-h-light.png" alt="Cerenity Innovation">
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="nav-links">
      <a href="index.html">AIエージェント</a>
      <a href="enterprise.html">エンタープライズ</a>
      <a href="app.html">アプリ</a>
      <a href="news.html">ニュース</a>
      <div class="lang-switch" aria-label="Language"><a href="../contact.html" lang="en" hreflang="en">EN</a><a href="contact.html" aria-current="page">JA</a></div>
      <a href="https://waitlister.me/p/cerenity" target="_blank" rel="noopener" class="cta">ウェイトリストに登録</a>
    </div>
  </nav>

  <header style="position: relative; background: #221E18; color: #FFFFFF; flex: 1; min-height: 100vh; display: flex; align-items: center; padding: 150px 44px 90px;">
    <div style="position: absolute; inset: 0; background: radial-gradient(120% 90% at 82% 18%, rgba(174,130,112,.18), transparent 55%), radial-gradient(90% 80% at 6% 94%, rgba(200,196,188,.12), transparent 60%); pointer-events: none;"></div>
    <div class="contact-grid" style="position: relative; max-width: 1120px; margin: 0 auto; width: 100%;">

      <div>
        <div data-reveal style="font-size: 12px; letter-spacing: .42em; text-transform: uppercase; color: #AE8270; margin-bottom: 34px;">Contact</div>
        <h1 data-reveal style="font-family: 'Newsreader', serif; font-weight: 300; font-size: clamp(42px, 6vw, 88px); line-height: 1.03; letter-spacing: -.02em; max-width: 13ch; text-wrap: balance;">お問い合わせ</h1>
        <p data-reveal style="margin-top: 34px; font-size: clamp(17px, 1.7vw, 21px); line-height: 1.55; max-width: 46ch; color: rgba(239,235,225,.72);">製品に関するご質問や協業のご相談など、お気軽にお問い合わせください。担当者よりご連絡いたします。</p>
      </div>

      <div data-reveal>
        <form data-mailto-form data-opening="メールアプリを開いています…" data-mailto="info@cerenityinnovation.com" class="contact-form" style="margin: 0; max-width: 100%;">
          <div class="row">
            <input name="name" type="text" placeholder="お名前" required autocomplete="name">
            <input name="email" type="email" placeholder="メールアドレス" required autocomplete="email">
          </div>
          <textarea name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
          <div class="actions">
            <button type="submit">メールアプリで送信</button>
            <span class="status" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>

    </div>
  </header>

  <footer style="background: #221E18; color: #FFFFFF; padding: 40px 44px 44px;">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; border-top: 1px solid rgba(239,235,225,.14); padding-top: 30px; font-size: 13px; color: rgba(239,235,225,.5);">
      <a href="index.html"><img src="../assets/logo-light.png" alt="Cerenity Innovation" style="height: 46px; display: block;"></a>
      <div class="footer-meta">
        <nav class="footer-legal" aria-label="Legal"><a href="../privacy.html">プライバシーポリシー</a><a href="../terms.html">利用規約</a><a href="../disclaimer.html">免責事項</a></nav>
        <span>© 2026 Cerenity Innovation. The human-centered layer for AI.</span>
      </div>
    </div>
  </footer>
